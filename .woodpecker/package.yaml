# Roadrunner developer-preview package (Woodpecker + Dagger, https://cicd.apps.example.com): port of
# .github/workflows/release-package.yml. Manual run with the pipeline variable VERSION (exact
# developer-preview semver, e.g. 0.1.0-dev.1): make validate-lock, secret-scan, package and
# package-verify on Python 3.12 inside ci-runner. A manual run without VERSION builds nothing.
# SOURCE_DATE_EPOCH = the commit time (what release/package.py reads from git; .git never enters
# the ci-runner call). No artifact upload (GitHub-only): the build proves the package is
# reproducible and prints the file list and checksum; rebuild locally with the same VERSION and
# commit for the bytes. Creates no release, publishes nothing, uses no secrets.
# `$$` escapes `$` for Woodpecker. Docs: https://cicd.docs.example.com/roadrunner/
labels:
  tier: "0"
when:
  - event: manual
    evaluate: 'VERSION != nil && VERSION != ""'
steps:
  - name: package
    image: bash
    environment:
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://192.0.2.1:4318/v1/logs
      OTEL_EXPORTER_OTLP_LOGS_PROTOCOL: http/protobuf
    commands:
      - |
        set -eu
        case "$$VERSION" in *[!0-9A-Za-z.+-]*) echo "VERSION '$$VERSION' has characters outside [0-9A-Za-z.+-]"; exit 1;; esac
        SDE=$$(git show -s --format=%ct HEAD)
        echo "package $$VERSION from $$CI_COMMIT_SHA (SOURCE_DATE_EPOCH=$$SDE)"
        ci-runner v0.10.1 python-plain --src=. --repo="$${CI_REPO_NAME,,}" --python=3.12 --apt=make \
          --env="RELEASE_VERSION=$$VERSION,SOURCE_DATE_EPOCH=$$SDE" \
          --run='make validate-lock && make secret-scan && make package VERSION="$$RELEASE_VERSION" && make package-verify VERSION="$$RELEASE_VERSION" && ls -l release/dist && cat release/dist/*.sha256' \
          --dep-cache=registry.dev.example.com/cache \
          --dep-cache-password=file:///etc/ci/cache-password --test-workers=2
