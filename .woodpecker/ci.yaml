# Roadrunner CI (Woodpecker + Dagger, https://cicd.apps.example.com): port of .github/workflows/ci.yml — every job: python (make ci-install, lint, unit + MCP tests, isolated install) on Python 3.9-3.13, exact-lock + strict docs + secret scan (3.12), shellcheck.
# `$$` escapes `$` for Woodpecker. Docs: https://cicd.docs.example.com/roadrunner/
labels:
  tier: "0"
when:
  - event: pull_request
  - event: [push, manual]
    branch: main
steps:
  - name: python-3.9
    image: bash
    depends_on: []
    environment:
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://192.0.2.1:4318/v1/logs
      OTEL_EXPORTER_OTLP_LOGS_PROTOCOL: http/protobuf
    commands:
      - >-
        ci-runner v0.10.1 python-plain --src=. --repo="$${CI_REPO_NAME,,}" --python=3.9 --apt=make
        --run='make ci-install && make lint && python -m pytest -vv -m "not mcp" release/tests tests/unit && make test-mcp && make install-test'
        --dep-cache=registry.dev.example.com/cache
        --dep-cache-password=file:///etc/ci/cache-password --test-workers=2
  - name: python-3.10
    image: bash
    depends_on: []
    environment:
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://192.0.2.1:4318/v1/logs
      OTEL_EXPORTER_OTLP_LOGS_PROTOCOL: http/protobuf
    commands:
      - >-
        ci-runner v0.10.1 python-plain --src=. --repo="$${CI_REPO_NAME,,}" --python=3.10 --apt=make
        --run='make ci-install && make lint && python -m pytest -vv -m "not mcp" release/tests tests/unit && make test-mcp && make install-test'
        --dep-cache=registry.dev.example.com/cache
        --dep-cache-password=file:///etc/ci/cache-password --test-workers=2
  - name: python-3.11
    image: bash
    depends_on: []
    environment:
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://192.0.2.1:4318/v1/logs
      OTEL_EXPORTER_OTLP_LOGS_PROTOCOL: http/protobuf
    commands:
      - >-
        ci-runner v0.10.1 python-plain --src=. --repo="$${CI_REPO_NAME,,}" --python=3.11 --apt=make
        --run='make ci-install && make lint && python -m pytest -vv -m "not mcp" release/tests tests/unit && make test-mcp && make install-test'
        --dep-cache=registry.dev.example.com/cache
        --dep-cache-password=file:///etc/ci/cache-password --test-workers=2
  - name: python-3.12
    image: bash
    depends_on: []
    environment:
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://192.0.2.1:4318/v1/logs
      OTEL_EXPORTER_OTLP_LOGS_PROTOCOL: http/protobuf
    commands:
      - >-
        ci-runner v0.10.1 python-plain --src=. --repo="$${CI_REPO_NAME,,}" --python=3.12 --apt=make
        --run='make ci-install && make lint && python -m pytest -vv -m "not mcp" release/tests tests/unit && make test-mcp && make install-test'
        --dep-cache=registry.dev.example.com/cache
        --dep-cache-password=file:///etc/ci/cache-password --test-workers=2
  - name: python-3.13
    image: bash
    depends_on: []
    environment:
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://192.0.2.1:4318/v1/logs
      OTEL_EXPORTER_OTLP_LOGS_PROTOCOL: http/protobuf
    commands:
      - >-
        ci-runner v0.10.1 python-plain --src=. --repo="$${CI_REPO_NAME,,}" --python=3.13 --apt=make
        --run='make ci-install && make lint && python -m pytest -vv -m "not mcp" release/tests tests/unit && make test-mcp && make install-test'
        --dep-cache=registry.dev.example.com/cache
        --dep-cache-password=file:///etc/ci/cache-password --test-workers=2
  - name: lock-docs-secrets
    image: bash
    depends_on: []
    environment:
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://192.0.2.1:4318/v1/logs
      OTEL_EXPORTER_OTLP_LOGS_PROTOCOL: http/protobuf
    commands:
      - >-
        ci-runner v0.10.1 python-plain --src=. --repo="$${CI_REPO_NAME,,}" --python=3.12 --apt=make
        --pip=mkdocs-material
        --run='make validate-lock && make docs-strict && make secret-scan'
        --dep-cache=registry.dev.example.com/cache
        --dep-cache-password=file:///etc/ci/cache-password --test-workers=2
  - name: shellcheck
    image: bash
    depends_on: []
    environment:
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://192.0.2.1:4318/v1/logs
      OTEL_EXPORTER_OTLP_LOGS_PROTOCOL: http/protobuf
    commands:
      - >-
        ci-runner v0.10.1 python-plain --src=. --repo="$${CI_REPO_NAME,,}" --python=3.12 --apt=shellcheck
        --run='mapfile -t scripts < <(find . -type f -name "*.sh" -not -path "./release/dist/*" -print);
        if [ "$${#scripts[@]}" -eq 0 ]; then echo "No shell scripts found"; else shellcheck --severity=warning "$${scripts[@]}"; fi'
        --dep-cache=registry.dev.example.com/cache
        --dep-cache-password=file:///etc/ci/cache-password --test-workers=2
