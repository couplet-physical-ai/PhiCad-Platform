[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "phicad-platform"
version = "0.1.0.dev1"
description = "Deterministic orchestration for the PhiCad developer preview"
requires-python = ">=3.9"
authors = [{name = "PhiCad contributors"}]
dependencies = []

[dependency-groups]
dev = ["pytest", "ruff"]

[project.scripts]
phicad-platform = "phicad_platform.cli:main"
phicad-platform-mcp = "phicad_platform.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "release/tests"]
addopts = "-q"
markers = ["mcp: credential-free stdio MCP protocol tests"]

[tool.ruff]
target-version = "py39"
line-length = 120
extend-exclude = ["docs/assets/vision"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B904"]
